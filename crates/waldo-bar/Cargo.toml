[package]
name = "waldo-bar"
description = "The Waldo bar: type a task, and Claude Code does it on this Mac."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Built from this repository with `make install`. It is not published.
publish = false

[dependencies]
serde_json.workspace = true
waldo-core.workspace = true

# The bar is a native macOS window. On other systems it builds as a stub.
[target.'cfg(target_os = "macos")'.dependencies]
# Pinned to a published gpui. runtime_shaders compiles the shaders at first
# launch, so the build needs no Metal toolchain.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
futures = "0.3"
